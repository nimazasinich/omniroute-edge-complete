name: One-time functional repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-functional.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded functional fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected source block not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Session refresh must fail closed after login, but startup checks may swallow the expected unauthenticated error.
          replace_once(
              'src/auth/AuthProvider.tsx',
              """  const refreshSession = useCallback(async () => {\n    try {\n      const session = await checkSession();\n      if (!session) {\n        setUser(null);\n        setPermissions(null);\n        setState('unauthenticated');\n        return null;\n      }\n      setUser(session.user);\n      setState('authenticated');\n      try { setPermissions(await checkPermissions()); } catch { setPermissions(null); }\n      return session.user;\n    } catch {\n      setUser(null);\n      setPermissions(null);\n      setState('unauthenticated');\n      return null;\n    }\n  }, []);\n\n  useEffect(() => { void refreshSession(); }, [refreshSession]);\n""",
              """  const refreshSession = useCallback(async () => {\n    try {\n      const session = await checkSession();\n      if (!session) {\n        setUser(null);\n        setPermissions(null);\n        setState('unauthenticated');\n        throw new Error('Secure browser session is not available.');\n      }\n      setUser(session.user);\n      setState('authenticated');\n      try { setPermissions(await checkPermissions()); } catch { setPermissions(null); }\n      return session.user;\n    } catch (cause) {\n      setUser(null);\n      setPermissions(null);\n      setState('unauthenticated');\n      if (cause instanceof Error) throw cause;\n      throw new Error('Unable to validate secure browser session.');\n    }\n  }, []);\n\n  useEffect(() => { void refreshSession().catch(() => undefined); }, [refreshSession]);\n""",
          )
          replace_once(
              'src/auth/AuthProvider.tsx',
              "if (state === 'authenticated') return <Navigate to=\"/\" replace/>;",
              "if (state === 'authenticated') return <Navigate to=\"/connecting\" replace/>;",
          )

          # 2) First admin provisioning accepts either the configured email or configured username.
          replace_once(
              'src/server/browserAuth.ts',
              """export async function ensureInitialAdmin(db: AppDb, config: BrowserAuthConfig, email: string, password: string): Promise<AuthUserRow | null> {\n  const existing = await db.query.authUsers.findFirst({ where: eq(authUsers.email, email) });\n  if (existing) return existing;\n  const initialEmail = normalizeEmail(config.INITIAL_ADMIN_EMAIL);\n  const initialPassword = config.INITIAL_ADMIN_PASSWORD ?? '';\n  if (!initialEmail || !initialPassword || !safeEqual(email, initialEmail) || !safeEqual(password, initialPassword)) return null;\n  const error = validatePassword(initialPassword);\n  if (error) throw new Error(`INITIAL_ADMIN_PASSWORD is not acceptable: ${error}`);\n  const configuredUsername = normalizeUsername(config.INITIAL_ADMIN_USERNAME);\n  const username = configuredUsername && !validateUsername(configuredUsername) ? configuredUsername : null;\n  return createUser(db, { email: initialEmail, username, displayName: 'Administrator', password: initialPassword });\n}\n""",
              """export function matchesInitialAdminIdentifier(config: BrowserAuthConfig, value: unknown, password: string): boolean {\n  const initialEmail = normalizeEmail(config.INITIAL_ADMIN_EMAIL);\n  const initialPassword = config.INITIAL_ADMIN_PASSWORD ?? '';\n  if (!initialEmail || !initialEmail.includes('@') || !initialPassword || !safeEqual(password, initialPassword)) return false;\n\n  const identifier = String(value ?? '').trim();\n  if (!identifier) return false;\n  if (identifier.includes('@')) return safeEqual(normalizeEmail(identifier), initialEmail);\n\n  const initialUsername = normalizeUsername(config.INITIAL_ADMIN_USERNAME);\n  if (!initialUsername || validateUsername(initialUsername)) return false;\n  return safeEqual(normalizeUsername(identifier), initialUsername);\n}\n\nexport async function ensureInitialAdmin(db: AppDb, config: BrowserAuthConfig, identifier: string, password: string): Promise<AuthUserRow | null> {\n  if (!matchesInitialAdminIdentifier(config, identifier, password)) return null;\n  const initialEmail = normalizeEmail(config.INITIAL_ADMIN_EMAIL);\n  const existing = await db.query.authUsers.findFirst({ where: eq(authUsers.email, initialEmail) });\n  if (existing) return existing;\n  const initialPassword = config.INITIAL_ADMIN_PASSWORD ?? '';\n  const error = validatePassword(initialPassword);\n  if (error) throw new Error(`INITIAL_ADMIN_PASSWORD is not acceptable: ${error}`);\n  const configuredUsername = normalizeUsername(config.INITIAL_ADMIN_USERNAME);\n  const username = configuredUsername && !validateUsername(configuredUsername) ? configuredUsername : null;\n  return createUser(db, { email: initialEmail, username, displayName: 'Administrator', password: initialPassword });\n}\n""",
          )
          replace_once(
              'src/server/app.ts',
              """  loginRateState,\n  normalizeEmail,\n""",
              """  loginRateState,\n  matchesInitialAdminIdentifier,\n  normalizeEmail,\n""",
          )
          replace_once(
              'src/server/app.ts',
              """  let user = await findUserByIdentifier(db, identifier);\n  if (!user && identifier.includes('@')) user = await ensureInitialAdmin(db, c.env, identifier, password);\n""",
              """  let user = await findUserByIdentifier(db, identifier);\n  if (!user && matchesInitialAdminIdentifier(c.env, identifier, password)) {\n    user = await ensureInitialAdmin(db, c.env, identifier, password);\n  }\n""",
          )

          # 3) Node/Docker control plane must be externally reachable and must serve the UI + API on one origin.
          replace_once(
              'server.ts',
              "const PORT = process.env.PORT ? Number.parseInt(process.env.PORT, 10) : 3001;\n",
              "const PORT = process.env.PORT ? Number.parseInt(process.env.PORT, 10) : 3001;\nconst HOST = process.env.HOST?.trim() || '127.0.0.1';\n",
          )
          replace_once(
              'server.ts',
              """  if (fs.existsSync('./dist')) {\n""",
              """  app.get('/favicon.ico', (c) => c.redirect('/favicon.svg', 302));\n\n  if (fs.existsSync('./dist')) {\n""",
          )
          replace_once(
              'server.ts',
              """    hostname: '127.0.0.1',\n""",
              """    hostname: HOST,\n""",
          )
          replace_once(
              'server.ts',
              """    console.log(`OmniRoute Edge local server listening on http://127.0.0.1:${info.port}`);\n""",
              """    console.log(`OmniRoute Edge server listening on http://${HOST}:${info.port}`);\n""",
          )

          # 4) Cloudflare static surface also handles legacy favicon.ico cleanly.
          replace_once(
              'src/worker.ts',
              """    const url = new URL(request.url);\n\n    if (url.pathname === '/v1' || url.pathname.startsWith('/v1/')) {\n""",
              """    const url = new URL(request.url);\n\n    if (url.pathname === '/favicon.ico') {\n      return Response.redirect(new URL('/favicon.svg', url).toString(), 302);\n    }\n\n    if (url.pathname === '/v1' || url.pathname.startsWith('/v1/')) {\n""",
          )

          # 5) Browser branding: explicit favicon so browsers no longer probe a missing default icon.
          replace_once(
              'index.html',
              """    <meta name=\"twitter:card\" content=\"summary_large_image\" />\n""",
              """    <meta name=\"twitter:card\" content=\"summary_large_image\" />\n    <meta name=\"theme-color\" content=\"#0f6fff\" />\n    <link rel=\"icon\" type=\"image/svg+xml\" href=\"/favicon.svg\" />\n    <link rel=\"shortcut icon\" href=\"/favicon.svg\" />\n""",
          )
          Path('public/favicon.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OmniRoute Edge">\n  <defs>\n    <linearGradient id="g" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">\n      <stop stop-color="#0f6fff"/>\n      <stop offset=".55" stop-color="#16b8d9"/>\n      <stop offset="1" stop-color="#28c995"/>\n    </linearGradient>\n  </defs>\n  <rect width="64" height="64" rx="16" fill="#07111f"/>\n  <path d="M19 43h27.5a9.5 9.5 0 0 0 1.4-18.9A16.5 16.5 0 0 0 17 25.7 8.8 8.8 0 0 0 19 43Z" fill="url(#g)"/>\n  <path d="M21 37h9l4-9 5 12 4-7h8" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>\n</svg>\n''', encoding='utf-8')

          # 6) Root Dockerfile is the deployable control plane. Origin-only runtime remains in Dockerfile.omniroute-origin.
          Path('Dockerfile').write_text('''FROM node:22-bookworm-slim AS build\n\nWORKDIR /app\nCOPY package.json package-lock.json ./\nRUN npm ci\n\nCOPY . .\nRUN npm run build \\\n    && ./node_modules/.bin/esbuild server.ts --bundle --platform=node --format=esm --packages=external --outfile=server.js \\\n    && npm prune --omit=dev\n\nFROM node:22-bookworm-slim AS runtime\n\nENV NODE_ENV=production \\\n    PORT=10000 \\\n    HOST=0.0.0.0 \\\n    SQLITE_DB_PATH=/var/lib/omniroute-edge/sqlite.db\n\nRUN groupadd --system omniroute-edge \\\n    && useradd --system --gid omniroute-edge --home-dir /var/lib/omniroute-edge omniroute-edge \\\n    && mkdir -p /app /var/lib/omniroute-edge \\\n    && chown -R omniroute-edge:omniroute-edge /app /var/lib/omniroute-edge\n\nWORKDIR /app\nCOPY --from=build --chown=omniroute-edge:omniroute-edge /app/package.json ./package.json\nCOPY --from=build --chown=omniroute-edge:omniroute-edge /app/node_modules ./node_modules\nCOPY --from=build --chown=omniroute-edge:omniroute-edge /app/dist ./dist\nCOPY --from=build --chown=omniroute-edge:omniroute-edge /app/server.js ./server.js\n\nVOLUME ["/var/lib/omniroute-edge"]\nEXPOSE 10000\nUSER omniroute-edge\n\nHEALTHCHECK --interval=30s --timeout=10s --start-period=20s --retries=3 \\\n  CMD node -e "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"\n\nCMD ["node", "server.js"]\n''', encoding='utf-8')

          # 7) Document the username bootstrap knob used by the actual backend.
          replace_once(
              '.env.example',
              """INITIAL_ADMIN_EMAIL=\nINITIAL_ADMIN_PASSWORD=\n""",
              """INITIAL_ADMIN_EMAIL=\nINITIAL_ADMIN_USERNAME=admin\nINITIAL_ADMIN_PASSWORD=\n""",
          )

          # 8) Update the regression contract to assert the fail-closed refresh implementation.
          p = Path('test-node/browser-auth-contract.test.mjs')
          text = p.read_text(encoding='utf-8')
          old = """test('successful password/bootstrap login must establish a readable session before redirecting', async () => {\n  const login = await read('src/components/DreamWorkerAuthScreen.tsx');\n  assert.ok(login.includes('const sessionUser = await refreshSession()'), 'login must retain refreshSession result');\n  assert.ok(login.includes('if (!sessionUser)'), 'login must fail closed when the new session cookie is not readable');\n  assert.ok(login.includes(\"navigate('/connecting', { replace: true })\"), 'login must enter the connecting verification flow only after session validation');\n});\n"""
          new = """test('successful password/bootstrap login must establish a readable session before redirecting', async () => {\n  const provider = await read('src/auth/AuthProvider.tsx');\n  const login = await read('src/components/DreamWorkerAuthScreen.tsx');\n  assert.ok(provider.includes(\"throw new Error('Secure browser session is not available.')\"), 'refreshSession must fail closed when the new session cookie is not readable');\n  assert.ok(provider.includes('refreshSession().catch(() => undefined)'), 'initial anonymous session check must consume the expected unauthenticated rejection');\n  assert.ok(login.includes('await refreshSession()'), 'login and bootstrap must await session validation');\n  assert.ok(login.includes(\"navigate('/connecting', { replace: true })\"), 'login must enter the connecting verification flow only after session validation');\n});\n"""
          if old not in text:
              raise SystemExit('expected login regression test block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile .env.example index.html public/favicon.svg server.ts src/worker.ts src/auth/AuthProvider.tsx src/server/app.ts src/server/browserAuth.ts test-node/browser-auth-contract.test.mjs
          git diff --cached --check
          git commit -m "Fix control-plane auth deployment and favicon"
          git push origin HEAD:main
